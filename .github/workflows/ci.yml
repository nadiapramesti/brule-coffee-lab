name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    name: Tes (Pest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_sqlite, sqlite3, gd, zip, intl, bcmath
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-${{ hashFiles('composer.lock') }}

      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: cp .env.example .env && php artisan key:generate
      - run: npm ci
      - run: npm run build
      - name: Jalankan Pest
        run: vendor/bin/pest

  security:
    name: Audit dependensi
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Composer audit
        run: composer audit --locked
        continue-on-error: true  # laporan saja; tinjau hasilnya, jangan abaikan
      - run: npm ci
      - name: npm audit
        run: npm audit --audit-level=high

  e2e:
    name: E2E dan aksesibilitas (Playwright)
    runs-on: ubuntu-latest
    env:
      DB_CONNECTION: sqlite
      DB_DATABASE: ${{ github.workspace }}/database/e2e.sqlite
      SESSION_DRIVER: file
      CACHE_STORE: file
      QUEUE_CONNECTION: sync
      MAIL_MAILER: log
      APP_URL: http://127.0.0.1:8000
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_sqlite, sqlite3, gd, zip, intl, bcmath
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: cp .env.example .env && php artisan key:generate
      - run: npm ci
      - run: npm run build
      - run: touch database/e2e.sqlite && php artisan migrate:fresh --seed --force
      - run: npx playwright install --with-deps chromium

      - name: Jalankan server
        run: |
          nohup php artisan serve --host=127.0.0.1 --port=8000 > serve.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8000/up && break; sleep 1; done

      - name: Tes E2E dan aksesibilitas
        run: npx playwright test

      - name: Simpan laporan bila gagal
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
            serve.log
          retention-days: 7
